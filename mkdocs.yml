site_name: OpenNerve
site_description: >-
  Open source bioelectronic medicine platform: an implantable pulse generator,
  stimulation/recording/sensing leads, wireless charger, and control software.
# site_url: TBD. During the draft phase this is served from Cloudflare Pages
# behind Cloudflare Access; set this once a public URL is settled (see
# CLAUDE.md §7, Hosting).

repo_name: opennerve-site
repo_url: https://github.com/axbaldwin1/opennerve-site
# NOTE: update repo_url/edit_uri if/when this repo moves to the CARSSCenter org.
edit_uri: edit/main/docs/

copyright: >-
  Content licensed CC-BY-4.0 unless noted otherwise. Licensing is under
  active review and may change on a repo-by-repo basis.

# docs/images/CREDITS.md documents image provenance for maintainers (CLAUDE.md
# §8) — not a published page. Excluding it here keeps it out of the built
# site without needing a nav entry, so --strict's orphaned-page check doesn't
# flag it.
exclude_docs: |
  images/CREDITS.md

# Local build-time hook. Not a plugin dependency (no pip package, no
# requirements.txt entry) — this is the mechanism CLAUDE.md §7 asks for so
# "Edit this page" on a federated/synced page points at the correct upstream
# repo instead of this one. See hooks/synced_edit_url.py.
hooks:
  - hooks/synced_edit_url.py

theme:
  name: material
  # Header goes white rather than a primary colour, and Material's Google Fonts
  # loading is disabled in favour of a self-hosted stack — both are asset-driven
  # decisions, not stylistic preference. Reasoning in CLAUDE.md §7 ("Visual identity
  # and header palette").
  logo: images/logo.png
  font: false
  # Light-mode only, for now (2026-08-06): single palette entry, no `toggle`
  # and no `media` query, so Material renders no light/dark switch and the
  # site ignores the visitor's OS color-scheme preference. Revisit if/when
  # dark mode is ready to ship — see CLAUDE.md §7's header-palette entry for
  # why `primary: white` was chosen in the first place.
  palette:
    - scheme: default
      primary: white
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.action.edit
    - content.code.copy
    - search.highlight
    - toc.follow

# Keep this list minimal — every plugin here is a piece of future breakage
# for a small team (CLAUDE.md §7). Two entries:
#   - search: MkDocs builtin, no extra dependency.
#   - git-revision-date-localized: gives every page a real "last updated"
#     date instead of a hand-maintained one, which matters for the
#     "Last reviewed" field CLAUDE.md §5 requires on component pages.
# Federated docs are NOT handled by a plugin (mkdocs-multirepo-plugin was
# considered and rejected — see CLAUDE.md §7 for why) but by
# tools/sync_docs.py, run out-of-band before `mkdocs build`.
plugins:
  - search
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
      enable_creation_date: false

extra_css:
  - stylesheets/fonts.css
  - stylesheets/extra.css
  - stylesheets/home.css

# Vendored, pinned pdf.js build (docs/javascripts/pdfjs/) plus a small wrapper
# script — no CDN, no new pip/npm dependency. See CLAUDE.md §7 "PDF viewer".
# nav-menu.js: header dropdown menus for the top-level nav.tabs (CLAUDE.md §7
# "Header dropdown menus"). header-icons.js: GitHub/message-board/LinkedIn/
# email icon links in the header (CLAUDE.md §7 "Header external links").
extra_javascript:
  - javascripts/pdf-embed.js
  - javascripts/nav-menu.js
  - javascripts/header-icons.js

# Moves this repo's own GitHub link out of the header (see CLAUDE.md §7
# "Header external links") and into the standard Material footer icon row
# instead — a config-only feature (no template override), so it's the
# built-in mechanism rather than another custom-JS injection.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/axbaldwin1/opennerve-site
      name: opennerve-site on GitHub

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: warn

nav:
  - Home: index.md
  - About:
      - Who we are: start/overview.md
      - Is this right for my work: start/fit.md
      - Platform architecture: start/architecture.md
      - Regulatory status and disclaimers: regulatory/status.md
      - Maturity level definitions: regulatory/maturity.md
  - Hardware:
      - Overview & maturity table: components/index.md
      - Implantable Pulse Generator:
          - Overview: components/ipg.md
          - Gen2 PCBA: components/ipg-gen2.md
          - Gen1 PCBA: components/ipg-gen1.md
          - MCU flashing guide: components/ipg/mcu-flashing.md
          - BLE flashing guide: components/ipg/ble-flashing.md
          - OTA firmware update guide: components/ipg/ota-updates.md
          - Logging guide: components/ipg/logging.md
          - Magnetic switch guide: components/ipg/magnetic-switch.md
          - Encryption instructions: components/ipg/encryption.md
          - Charging (CAR-212): components/ipg/charging.md
          - WPT implementation report: components/ipg/wpt-report.md
          - Impedance measurement strategy: components/ipg/impedance.md
          - "Tools: sine wave generator": components/ipg/tools-sine-wave-generator.md
          - "Tools: OTA updater user guide": components/ipg/tools-ota-updater.md
      - Development board: components/dev-board.md
      - Standard Leads: components/standard-leads.md
      - Sub-mm Parylene Cuff: components/parylene-cuff.md
      - Bring your own lead: components/byo-lead.md
      - Charger:
          - Overview: components/charger.md
          - Firmware report: components/charger/firmware-report.md
      - Mechanical Sensors:
          - Overview: components/mechanical-sensors.md
          - Strain sensor troubleshooting: components/mechanical-sensors/strain-troubleshooting.md
          - "Strain sensor: CapSense PCB integration": components/mechanical-sensors/strain-capsense-integration.md
          - Temperature sensor calibration & characterization: components/mechanical-sensors/temperature-calibration.md
          - Temperature sensor design & fabrication: components/mechanical-sensors/temperature-fabrication.md
      - Chemical Sensors:
          - Overview: components/chemical-sensors.md
          - Characterization of echem sensors: components/chemical-sensors/characterization.md
          - Fabrication of echem sensors: components/chemical-sensors/fabrication.md
  - Software:
      - Windows App:
          - Overview: software/windows.md
          - Getting started: software/windows/getting-started.md
          - Developer guide: software/windows/developer-guide.md
      - Android App: software/android.md
  - Resources:
      - Publications: data/publications.md
      - Animal data: data/animal-data.md
      - News: news.md
      - Educational Resources: data/educational-resources.md
  - Community:
      - Overview: community/index.md
      - How to contribute: contribute/index.md
      - Hardware contributions: contribute/hardware.md
      - Governance: contribute/governance.md

  
